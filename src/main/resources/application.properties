# =====================================================
# RAND BARBERÍA - CONFIGURACIÓN LOCAL / BASE
# =====================================================

spring.application.name=rand-barberia

# MySQL. En servidor usa variables de entorno y no guardes credenciales reales aquí.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/barberia_db?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Flyway es el único responsable de modificar la estructura de la base de datos.
# baseline-on-migrate permite adoptar automáticamente una BD vieja del proyecto:
# la marca como versión 1 y aplica desde V2 en adelante.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# Hibernate infiere el dialecto desde la conexión y solo valida; no altera tablas silenciosamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Sesión
server.servlet.session.timeout=60m
server.servlet.session.cookie.name=RANDSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Errores: no exponer stack traces ni detalles internos al navegador.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Administrador inicial SOLO para el primer arranque/local.
# En producción cambia estas variables y luego usa BOOTSTRAP_ADMIN=false.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN:false}
app.bootstrap-admin.email=${APP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
app.bootstrap-admin.telefono=${APP_ADMIN_TELEFONO:}

# Lista separada por comas. Vacía significa que el API solo acepta el mismo origen.
app.security.allowed-origins=${ALLOWED_ORIGINS:}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}
app.security.public-write.max-requests=${PUBLIC_WRITE_MAX_REQUESTS:30}
app.security.public-write.window-minutes=${PUBLIC_WRITE_WINDOW_MINUTES:1}
