# =====================================================
# RAND BARBERÍA - PERFIL DE PRODUCCIÓN
# Actívalo con: SPRING_PROFILES_ACTIVE=prod
# =====================================================

# En producción estas tres variables son obligatorias.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.security.allowed-origins=${ALLOWED_ORIGINS:}

# Nunca crear un administrador con credenciales conocidas en producción.
app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN:false}
app.bootstrap-admin.email=${APP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
app.bootstrap-admin.telefono=${APP_ADMIN_TELEFONO:}

# Cookie de sesión solo por HTTPS.
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework
